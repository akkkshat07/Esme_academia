<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>ESME Learning - Sign in</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="login-page">
  <div class="login-product-layer" aria-hidden="true">
    <div class="product-orb orb-1"></div>
    <div class="product-orb orb-2"></div>
    <div class="product-orb orb-3"></div>
    <div class="product-orb orb-4"></div>
  </div>

  <div class="floating-words" aria-hidden="true">
    <span>Learning</span>
    <span>Growth</span>
    <span>Sales</span>
    <span>Coaching</span>
    <span>Performance</span>
    <span>Success</span>
  </div>

  <main class="login-shell">
    <section class="login-panel" role="main">
      <div class="login-brand-block">
        <img src="img/esme.jpg" alt="ESME" class="login-logo" />
        <div class="login-brand-name">ESME Learning Academy</div>
      </div>

      <h1 class="login-heading">Welcome back</h1>
      <p class="login-subtext">Sign in to your account</p>

      <form id="loginForm" class="login-form" novalidate>
        <label for="emailOrPhone" class="login-label">Email or Phone</label>
        <div class="login-input-group">
          <input
            id="emailOrPhone"
            type="text"
            inputmode="email"
            autocomplete="username"
            placeholder="name@company.com or 9876543210"
            required
            class="login-input"
          />
        </div>

        <div id="otpModeContainer" style="display: none;">
          <label for="otpCode" class="login-label">Verification Code</label>
          <p class="otp-info" id="otpInfo"></p>
          <input
            id="otpCode"
            type="text"
            inputmode="numeric"
            maxlength="6"
            placeholder="000000"
            class="login-input otp-input"
          />
          <button type="button" id="verifyOtpBtn" class="login-btn">Verify Code</button>
          <button type="button" id="resendOtpBtn" class="login-btn-secondary">Resend Code</button>
          <button type="button" id="backToPasswordBtn" class="login-btn-secondary">Login with Password</button>
          <div id="otpError" class="login-error" aria-live="polite"></div>
        </div>

        <div id="passwordModeContainer">
          <label for="password" class="login-label">Password</label>
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="••••••••"
            required
            class="login-input"
          />
          <div class="otp-button-group">
            <button type="submit" class="login-btn">Sign in</button>
          </div>
          <div class="otp-action-row">
            <button type="button" id="sendOtpBtn" class="login-btn-secondary full-width">
              Send OTP via Phone
            </button>
          </div>
          <div id="passwordError" class="login-error" aria-live="polite"></div>
        </div>
      </form>
      
      <p class="login-footer">
        Trouble signing in? Contact HR/L&amp;D.
      </p>
    </section>
  </main>

  <!-- Firebase SDK Removed (Twilio Migration) -->
  <!-- <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script> -->
  <!-- <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script> -->

  <!-- firebase-config.js removed -->
  <script src="auth-otp-unified.js?v=20" defer></script>
  <script src="script.js?v=19" defer></script>
</body>
</html>
