<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Player - Esme Academy</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    :root {
      --primary: #0ea5e9;
      --primary-dark: #0284c7;
      --text: #0f172a;
      --text-light: #64748b;
      --bg-page: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
    }
    
    body {
      background-color: var(--bg-page);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      margin: 0;
      color: var(--text);
    }

    /* Navigation */
    .player-nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .back-link {
      color: var(--text-light);
      text-decoration: none;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--primary); }
    
    .brand { font-weight: 700; color: var(--text); font-size: 0.95rem; }

    /* Main Container */
    .player-layout {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.5rem;
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 2rem;
    }

    /* Main Content */
    .player-main {
      min-width: 0; /* Prevents flex/grid overflow issues */
    }

    /* Video Header */
    .player-head { 
      display: flex; 
      align-items: flex-end; 
      justify-content: space-between; 
      gap: 1.5rem; 
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    
    .video-info h1 {
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0.5rem 0 0 0;
      line-height: 1.3;
    }
    
    .badge {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.025em;
      text-transform: uppercase;
      background: #e0f2fe;
      color: #0369a1;
    }

    .video-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    /* Buttons & Pills */
    .btn { 
      display: inline-flex; 
      align-items: center; 
      gap: 0.4rem; 
      padding: 0.4rem 0.8rem; 
      border-radius: 6px; 
      text-decoration: none; 
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s;
      cursor: pointer;
    }
    .btn--secondary { 
      background: #fff; 
      border: 1px solid var(--border); 
      color: var(--text); 
    }
    .btn--secondary:hover { background: #f1f5f9; border-color: #cbd5e1; }
    
    .btn--nav {
      background: var(--primary);
      color: #fff;
      border: 1px solid var(--primary);
    }
    .btn--nav:hover { background: var(--primary-dark); }
    .btn--nav:disabled { opacity: 0.5; cursor: not-allowed; background: var(--text-light); border-color: var(--text-light); }

    .progress-pill {
      font-size: 0.8rem;
      color: var(--text-light);
      background: #f1f5f9;
      padding: 0.35rem 0.7rem;
      border-radius: 6px;
      font-weight: 500;
    }

    /* Video Player Container */
    .video-container {
      position: relative;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      aspect-ratio: 16 / 9;
      background: #000;
      margin-bottom: 2rem;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Sidebar */
    .player-sidebar {
      background: #fff;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: fit-content;
      max-height: calc(100vh - 100px);
      overflow: hidden;
    }

    .sidebar-header {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      font-size: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .playlist {
      overflow-y: auto;
      flex: 1;
      padding: 0.5rem;
    }

    .playlist-item {
      display: flex;
      gap: 0.75rem;
      padding: 0.75rem;
      border-radius: 8px;
      text-decoration: none;
      color: var(--text);
      transition: background 0.2s;
      cursor: pointer;
    }
    .playlist-item:hover {
      background: #f8fafc;
    }
    .playlist-item.active {
      background: #e0f2fe;
      border: 1px solid #bae6fd;
    }

    .pl-thumb {
      width: 100px;
      height: 56px;
      border-radius: 4px;
      background: #eee;
      object-fit: cover;
      flex-shrink: 0;
    }
    
    .pl-info {
      flex: 1;
      min-width: 0;
    }
    .pl-title {
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 0.25rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .pl-meta {
      font-size: 0.75rem;
      color: var(--text-light);
    }

    .controls-bar {
        display: flex;
        justify-content: space-between;
        margin-top: 1rem;
        padding: 1rem;
        background: #fff;
        border-radius: 8px;
        border: 1px solid var(--border);
    }
    
    .playlist-empty {
        padding: 2rem;
        text-align: center;
        color: var(--text-light);
        font-size: 0.9rem;
    }

    @media (max-width: 1024px) {
      .player-layout {
        grid-template-columns: 1fr;
      }
      .player-sidebar {
        max-height: 500px;
      }
    }

    @media (max-width: 640px) {
      .player-head { flex-direction: column; align-items: flex-start; gap: 0.75rem; }
      .video-actions { width: 100%; justify-content: space-between; }
      .player-layout { padding: 1rem; gap: 1.5rem; }
      .player-nav { padding: 0.75rem 1rem; }
      .video-container { border-radius: 8px; }
      .controls-bar { flex-direction: column; gap: 1rem; }
      .controls-bar button { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  
  <nav class="player-nav">
    <a href="dashboard.html" class="back-link">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" />
      </svg>
      Back to Dashboard
    </a>
    <div class="brand">ESME Learning</div>
  </nav>

  <div class="player-layout">
    <div class="player-main">
      <div class="video-container">
          <!-- Added preload="auto" to force buffering as fast as possible -->
          <video id="video" playsinline controls preload="auto"></video>
      </div>

      <div class="player-head">
        <div class="video-info">
          <div id="p-category" class="badge">Category</div>
          <h1 id="p-title">Course Title</h1>
        </div>
        <div class="video-actions">
          <span id="progressPill" class="progress-pill">0% watched</span>
          <a id="btn-download" class="btn btn--secondary" href="#" download>
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
            </svg>
            Download
          </a>
        </div>
      </div>
      
      <div class="controls-bar">
          <button id="btn-prev" class="btn btn--secondary" disabled>
             <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
             Previous Lesson
          </button>
          <button id="btn-next" class="btn btn--nav" disabled>
             Next Lesson
             <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
          </button>
      </div>
    </div>

    <!-- Right Sidebar -->
    <aside class="player-sidebar">
        <div class="sidebar-header">
            <span>Course Content</span>
            <span style="font-size: 0.8em; font-weight: normal; color: #666;" id="playlist-count">0 items</span>
        </div>
        <div style="padding: 0.75rem; border-bottom: 1px solid var(--border);">
            <input type="text" id="playlist-search" placeholder="Search lessons..." 
                   style="width: 100%; padding: 0.5rem 0.75rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.85rem; outline: none; box-sizing: border-box;">
        </div>
        <div id="playlist" class="playlist">
            <!-- Items injected by JS -->
            <div class="playlist-empty">Loading videos...</div>
        </div>
    </aside>
  </div>

  <script src="player.js"></script>
</body>
</html>
