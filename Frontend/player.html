<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Player</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .player-wrap { max-width: 920px; margin: 24px auto; padding: 0 12px; }
    .player-head { display:flex; align-items:center; justify-content:space-between; gap:1rem; }
    .player-meta { color:#5b6b7b; margin:.25rem 0 1rem; }
    .btn { display:inline-flex; align-items:center; gap:.5rem; padding:.55rem .85rem; border-radius:10px; text-decoration:none; border:1px solid #dfe6ee; background:#fff;}
    .btn--primary { background:#0ea5e9; color:#002133; border-color:#0ea5e9;}
    video { width:100%; max-height:70vh; background:#000; border-radius:12px; }
  </style>
</head>
<body>
  <div class="player-wrap">
    <div class="player-head">
      <div>
        <h2 id="p-title" style="margin:0 0 .25rem 0;">Title</h2>
        <div id="p-category" class="player-meta">Category</div>
      </div>
      <div>
        <a id="btn-download" class="btn" href="#" download>Download</a>
      </div>
    </div>

    <video id="video" playsinline controls preload="metadata"></video>
  </div>

  <script src="player.js"></script>
</body>
</html>
